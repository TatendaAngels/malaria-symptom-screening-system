<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Live Monitor | MalariaAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Chart.js for the graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-container { max-width: 1000px; margin: 40px auto; padding: 20px; color: white; }
        .dashboard-header { text-align: center; margin-bottom: 30px; }
        .live-indicator { display: inline-block; width: 12px; height: 12px; background: #00ff00; border-radius: 50%; margin-right: 8px; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .card { background: #2a2a40; padding: 20px; border-radius: 12px; text-align: center; border-left: 4px solid #d1b3ff; }
        .card h3 { font-size: 0.9em; color: #aaa; margin-bottom: 10px; text-transform: uppercase; }
        .card .value { font-size: 2em; font-weight: bold; color: white; }
        .card .unit { font-size: 0.5em; color: #888; }

        .risk-moderate { color: #ffdd00 !important; }
        .risk-higher { color: #ffaa00 !important; }
        .risk-urgent { color: #ff4d4d !important; }
        .risk-lower { color: #00cc44 !important; }

        .charts-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .charts-container { grid-template-columns: 1fr; } }
        .chart-box { background: #2a2a40; padding: 20px; border-radius: 12px; height: 300px; }

        .status-text { font-size: 0.9em; color: #aaa; text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <!-- Include your navbar here if you have a common one -->

    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>📡 Live IoT Monitor</h1>
            <p><span class="live-indicator"></span> Auto-refreshing every 3 seconds</p>
            <div id="connection-status" class="status-text">Waiting for data...</div>
        </div>

        <div class="grid-cards">
            <div class="card">
                <h3>Body Temp</h3>
                <div class="value" id="live-temp">-- <span class="unit">°C</span></div>
            </div>
            <div class="card">
                <h3>Heart Rate</h3>
                <div class="value" id="live-hr">-- <span class="unit">BPM</span></div>
            </div>
            <div class="card">
                <h3>AI Risk Level</h3>
                <div class="value" id="live-risk">--</div>
            </div>
            <div class="card">
                <h3>Last Update</h3>
                <div class="value" id="live-time" style="font-size: 1.2em; padding-top: 10px;">--:--</div>
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <canvas id="tempChart"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="hrChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Initialize Chart.js
        const commonOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                x: { display: false }, // Hide X axis for cleaner look
                y: { grid: { color: '#3b3b5c' }, ticks: { color: '#aaa' } }
            }
        };

        const tempChart = new Chart(document.getElementById('tempChart'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Temperature', data: [], borderColor: '#d1b3ff', tension: 0.4 }] },
            options: { ...commonOptions, plugins: { ...commonOptions.plugins, title: { display: true, text: 'Temperature History', color: 'white' } } }
        });

        const hrChart = new Chart(document.getElementById('hrChart'), {
            type: 'line',
            data: { labels: [], datasets: [{ label: 'Heart Rate', data: [], borderColor: '#ff4d4d', tension: 0.4 }] },
            options: { ...commonOptions, plugins: { ...commonOptions.plugins, title: { display: true, text: 'Heart Rate History', color: 'white' } } }
        });

        async function fetchData() {
            try {
                // Fetch Latest
                const latestRes = await fetch('/api/iot-latest');
                const latest = await latestRes.json();

                if (latest.status === 'no_data' || !latest.timestamp) {
                    document.getElementById('connection-status').innerText = "No data received yet. Connect hardware.";
                    return;
                }

                // Check if data is stale (older than 15 seconds)
                const lastUpdate = new Date(latest.timestamp + "Z");
                const now = new Date();
                const diffSeconds = (now - lastUpdate) / 1000;

                if (diffSeconds > 15) {
                    document.getElementById('connection-status').innerText = "⚠️ Device disconnected. Showing last known data.";
                    document.getElementById('connection-status').style.color = "#ff4d4d";
                } else {
                    document.getElementById('connection-status').innerText = "✅ Device Connected & Live";
                    document.getElementById('connection-status').style.color = "#00cc44";
                }

                // Update Cards
                document.getElementById('live-temp').innerHTML = `${latest.temperature.toFixed(1)} <span class="unit">°C</span>`;
                document.getElementById('live-hr').innerHTML = `${latest.heart_rate.toFixed(1)} <span class="unit">BPM</span>`;

                const riskEl = document.getElementById('live-risk');
                riskEl.innerText = latest.risk_level.toUpperCase();
                riskEl.className = `value risk-${latest.risk_level}`;

                document.getElementById('live-time').innerText = lastUpdate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                // Fetch History
                const historyRes = await fetch('/api/iot-history');
                const history = await historyRes.json();

                const labels = history.map(h => new Date(h.timestamp).toLocaleTimeString());
                const temps = history.map(h => h.temperature);
                const hrs = history.map(h => h.heart_rate);

                // Update Graphs
                tempChart.data.labels = labels;
                tempChart.data.datasets[0].data = temps;
                tempChart.update();

                hrChart.data.labels = labels;
                hrChart.data.datasets[0].data = hrs;
                hrChart.update();

            } catch (error) {
                console.error("Error fetching data:", error);
            }
        }

        // Run immediately, then every 3 seconds
        fetchData();
        setInterval(fetchData, 3000);
    </script>
</body>
</html>
