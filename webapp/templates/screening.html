<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Screening - MalariaAI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='8') }}">
    <script src="{{ url_for('static', filename='js/script.js', v='15') }}" defer></script>
    <!-- Assuming your girls' CSS is here -->
    <style>
        /* Extra styles specifically for the form steps */
        .step { display: none; }
        .step.active { display: block; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 10px 20px; border-radius: 20px; cursor: pointer; border: none; background: #d1b3ff; color: #000; font-weight: bold; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-card {
            --risk-color: #b7a0d4;
            margin-top: 24px;
            padding: 24px;
            border: 1px solid #ffffff1a;
            border-left: 5px solid var(--risk-color);
            border-radius: 16px;
            background: #241832;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.25);
            color: #f5f0fa;
        }
        .result-card.risk-lower { --risk-color: #58d6a0; }
        .result-card.risk-moderate { --risk-color: #f0ce65; }
        .result-card.risk-higher { --risk-color: #f0a35f; }
        .result-card.risk-urgent { --risk-color: #f2767d; }
        .result-card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
        .result-eyebrow { margin: 0 0 6px; color: #b9a9cc; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; }
        .result-card h3 { margin: 0; color: #fff; font-size: 1.35rem; }
        .risk-badge { flex: 0 0 auto; padding: 7px 12px; border: 1px solid var(--risk-color); border-radius: 999px; color: var(--risk-color); font-size: 0.82rem; font-weight: 700; text-transform: capitalize; }
        .result-divider { height: 1px; margin: 18px 0; background: #ffffff18; }
        .result-section-label { display: block; margin-bottom: 8px; color: #b9a9cc; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
        .result-advice { padding: 16px; border: 1px solid #ffffff12; border-radius: 12px; background: #ffffff08; }
        .result-card p { margin: 0; color: #e4dbea; line-height: 1.7; }
        .result-card .advice-text { color: #fff; font-size: 1rem; font-weight: 600; }
        .result-factors { margin-top: 18px !important; color: #d3c6df !important; }
        .result-factors strong { color: #fff; }
        .result-danger { margin-bottom: 16px; padding: 14px 16px; border: 1px solid #f2767d66; border-radius: 12px; background: #f2767d12; }
        .result-danger strong { display: block; margin-bottom: 5px; color: #ff9a9f; }
        .result-danger p { color: #f4dfe0; }
        .result-disclaimer { margin-top: 18px !important; padding-top: 16px; border-top: 1px solid #ffffff18; color: #b9a9cc !important; font-size: 0.82rem; }
        @media (max-width: 480px) {
            .result-card { padding: 18px; }
            .result-card-header { flex-direction: column; }
        }

        /* Mobile Responsiveness */
        @media (max-width: 600px) {
            /* Make the symptom grid single-column on small phones */
            div[style*="grid-template-columns"] {
                grid-template-columns: 1fr !important;
            }
            /* Adjust padding for smaller screens */
            main {
                margin: 20px auto !important;
                padding: 15px !important;
            }
            h2 { font-size: 1.5em; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a href="{{ url_for('home') }}" class="logo"><span class="logo-mark">+</span>Malaria<span>AI</span></a>
        <button class="menu-toggle" type="button" aria-label="Open navigation menu"
                aria-controls="nav-links" aria-expanded="false">
            <span aria-hidden="true">☰</span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('about') }}">About</a>
            <a href="{{ url_for('how_it_works') }}">How It Works</a>
            <a href="{{ url_for('contact') }}">Contact</a>
            <a href="{{ url_for('screening') }}" class="nav-button mobile-only" aria-current="page">Start Screening ↗</a>
        </nav>
        <a href="{{ url_for('screening') }}" class="nav-button desktop-only" aria-current="page">Start Screening ↗</a>
    </header>
    
    <main style="max-width: 600px; margin: 50px auto; padding: 20px; background: #1a1a2e; color: white; border-radius: 16px;">
        <h2>AI Symptom Screening</h2>
        <p>Answer a few questions to get a risk assessment.</p>

        <form id="screeningForm">
            <!-- STEP 1: Basics -->
            <div class="step active" id="step1">
                <h3>Step 1 of 3: Basic Info</h3>
                <div class="form-group">
                    <label>Age (years):</label>
                    <input type="number" name="age" required min="0" max="120">
                </div>
                <div class="form-group">
                    <label>Sex:</label>
                    <select name="sex" required>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Temperature (°C) - Optional:</label>
                    <input type="number" step="0.1" name="temp_c" min="34" max="43" placeholder="e.g. 38.5">
                </div>
                <div class="btn-group">
                    <button type="button" class="btn" onclick="nextStep(2)">Next Step →</button>
                </div>
            </div>

            <!-- STEP 2: Symptoms -->
            <div class="step" id="step2">
                <h3>Step 2 of 3: Symptoms</h3>
                <p>Check any that apply:</p>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <label><input type="checkbox" name="fever_now" value="1"> Fever now</label>
                    <label><input type="checkbox" name="fever_48h" value="1"> Fever > 48h</label>
                    <label><input type="checkbox" name="headache" value="1"> Headache</label>
                    <label><input type="checkbox" name="chills" value="1"> Chills/Shivering</label>
                    <label><input type="checkbox" name="vomiting" value="1"> Vomiting</label>
                    <label><input type="checkbox" name="nausea" value="1"> Nausea</label>
                    <label><input type="checkbox" name="muscle_pain" value="1"> Muscle pain</label>
                    <label><input type="checkbox" name="joint_pain" value="1"> Joint pain</label>
                    <label><input type="checkbox" name="prostration" value="1"> Extreme weakness</label>
                    <label><input type="checkbox" name="loss_appetite" value="1"> Loss of appetite</label>
                    <label><input type="checkbox" name="diarrhea" value="1"> Diarrhea</label>
                    <label><input type="checkbox" name="abdominal_pain" value="1"> Stomach pain</label>
                    <label><input type="checkbox" name="cough" value="1"> Cough</label>
                    <label><input type="checkbox" name="runny_nose" value="1"> Runny nose</label>
                </div>

                <h4 style="margin-top: 20px; color: #ff9999;">Danger Signs</h4>
                <p style="font-size: 0.9em; margin-bottom: 10px;">Check these immediately if present:</p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <label><input type="checkbox" name="convulsions" value="1"> Convulsions/Fits</label>
                    <label><input type="checkbox" name="confusion" value="1"> Confusion</label>
                    <label><input type="checkbox" name="resp_distress" value="1"> Difficulty breathing</label>
                    <label><input type="checkbox" name="bleeding" value="1"> Unusual bleeding</label>
                    <label><input type="checkbox" name="jaundice" value="1"> Yellow eyes/skin</label>
                    <label><input type="checkbox" name="dark_urine" value="1"> Dark urine</label>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn" onclick="nextStep(1)">← Back</button>
                    <button type="button" class="btn" onclick="submitForm()">Get Result →</button>
                </div>
            </div>

            <!-- STEP 3: Result -->
            <div class="step" id="step3">
                <h3>Step 3 of 3: Your Result</h3>
                <div id="resultContainer"></div>
                <div class="btn-group">
                    <button type="button" class="btn" onclick="location.reload()">Start Over</button>
                </div>
            </div>
        </form>
    </main>

    <script>
        // --- Auto-fill from IoT Dashboard ---
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const temp = Number(urlParams.get('temp'));
            const hrParam = urlParams.get('hr');
            const hr = hrParam === null ? NaN : Number(hrParam);

            if (!urlParams.has('temp') || !Number.isFinite(temp) || temp < 34 || temp > 43) return;

            const tempInput = document.querySelector('input[name="temp_c"]');
            if (tempInput) tempInput.value = temp.toFixed(1);

            const step1 = document.getElementById('step1');
            if (!step1) return;

            const banner = document.createElement('div');
            banner.style.cssText = "background: #3b3b5c; padding: 15px; border-radius: 8px; margin-bottom: 20px; color: #d1b3ff; text-align: center;";
            const heading = document.createElement('strong');
            heading.textContent = 'Vitals received from IoT device:';
            banner.append('📡 ', heading, document.createElement('br'));
            banner.append(`Temp: ${temp.toFixed(1)}°C | Heart Rate: ${Number.isFinite(hr) ? hr.toFixed(0) : 'Unavailable'} BPM`);
            step1.insertBefore(banner, step1.firstChild);
        });

        // Step Navigation
        function nextStep(stepNumber) {
            // Basic HTML5 validation for step 1
            if (stepNumber === 2) {
                const age = document.querySelector('input[name="age"]').value;
                if (!age) { alert("Please enter an age."); return; }
            }

            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${stepNumber}`).classList.add('active');
        }

        // Submit Data to Flask API
        async function submitForm() {
            const form = document.getElementById('screeningForm');
            const formData = new FormData(form);
            const data = {};

            // Convert FormData to JSON
            formData.forEach((value, key) => {
                data[key] = value === "1" ? 1 : value; // Ensure checkboxes are integers
            });
            
            // If checkboxes were unchecked, they are missing from FormData. 
            // Python handles missing as 0, but let's be safe.

            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    alert("Error: " + (result.error || "Unknown error"));
                    return;
                }

                // Show Step 3
                nextStep(3);
                
                // Render Result
                const container = document.getElementById('resultContainer');

                // Build the result HTML
                let factorsHtml = result.main_factors.length > 0 
                    ? `<p class="result-factors"><strong>Main factors</strong><br>${result.main_factors.join(", ")}</p>` 
                    : "";
                    
                let dangerHtml = result.danger_signs.length > 0
                    ? `<div class="result-danger" role="alert"><strong>Danger signs detected</strong><p>${result.danger_signs.join(", ")}. Please seek immediate medical help.</p></div>`
                    : "";

                container.innerHTML = `
                    <section class="result-card risk-${result.risk_level}" aria-live="polite">
                        <div class="result-card-header">
                            <div>
                                <p class="result-eyebrow">Screening result</p>
                                <h3>Your result</h3>
                            </div>
                            <span class="risk-badge">${result.risk_level}</span>
                        </div>
                        <div class="result-divider"></div>
                        ${dangerHtml}
                        <div class="result-advice">
                            <span class="result-section-label">Recommended next step</span>
                            <p class="advice-text">${result.advice}</p>
                        </div>
                        ${factorsHtml}
                        <p class="result-disclaimer">⚠️ ${result.disclaimer}</p>
                    </section>
                `;

            } catch (error) {
                alert("Failed to connect to the server. Check your terminal.");
            }
        }
    </script>
</body>
</html>
